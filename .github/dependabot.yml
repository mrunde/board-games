version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/backend/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
    pull-request-branch-name:
      separator: "_"
    commit-message:
      prefix: "[dependabot]"
    labels:
      - "dependabot"
